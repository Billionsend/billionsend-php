name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Check (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ["8.1", "8.3", "8.4"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, json
          coverage: none
      - run: composer validate --strict
      - run: composer install --no-interaction --no-progress
      - name: Generated code matches the OpenAPI snapshot
        run: php bin/generate.php --check
      - name: Every file parses
        run: find src tests bin -name '*.php' -print0 | xargs -0 -n1 php -l > /dev/null
      - run: vendor/bin/phpunit
